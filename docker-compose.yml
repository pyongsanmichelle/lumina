services:
  db:
    image: postgres:18-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${DB_NAME:-lumina}
      - POSTGRES_USER=${DB_USER:-luminar}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_dev_pass_2026}
    command: ["postgres", "-c", "timezone=Asia/Tokyo"]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-luminar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: nuxt_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    environment:
      - NODE_ENV=development
    restart: always

  bff:
    image: eclipse-temurin:25-jdk-jammy
    container_name: spring_bff
    ports:
      - "8080:8080"
    volumes:
      - ./bff:/app/bff
    working_dir: /app/bff
    command: ./gradlew bootRun --continuous
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: always

  api:
    image: eclipse-temurin:25-jdk-jammy
    container_name: spring_api
    ports:
      - "8081:8081"
    volumes:
      - ./api:/app/api
    working_dir: /app/api
    command: ./gradlew bootRun --continuous
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=lumina
      - DB_SCHEMA=general
      - DB_USER=luminar
      - DB_PASSWORD=secure_dev_pass_2026
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
