services:
  db:
    image: postgres:18-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${DB_NAME:-lumina}
      - POSTGRES_USER=${DB_USER:-luminar}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_dev_pass_2026}
    command: ["postgres", "-c", "timezone=Asia/Tokyo"]
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-luminar} -d ${DB_NAME:-lumina}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: nuxt_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    environment:
      - NODE_ENV=development
    restart: always

  bff:
    image: eclipse-temurin:25-jdk-jammy
    container_name: spring_bff
    ports:
      - "8080:8080"
    volumes:
      - ./bff:/app/bff
    working_dir: /app/bff
    command: ./gradlew bootRun --continuous
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - APP_API_BASE_URL=http://api:8081/api/v1
      # Keycloak OIDC設定（値は .env から注入）
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - BFF_ORIGIN=${BFF_ORIGIN:-http://localhost:8080}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    restart: always

  api:
    image: eclipse-temurin:25-jdk-jammy
    container_name: spring_api
    ports:
      - "8081:8081"
    volumes:
      - ./api:/app/api
    working_dir: /app/api
    command: ./gradlew bootRun --continuous
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=lumina
      - DB_SCHEMA=general
      - DB_USER=luminar
      - DB_PASSWORD=secure_dev_pass_2026
    depends_on:
      db:
        condition: service_healthy
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak_server
    ports:
      - "8082:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import
    working_dir: /opt/keycloak
    command: start-dev --import-realm
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=http://localhost:8082
      - KC_HOSTNAME_STRICT=false
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

volumes:
  postgres_data:
