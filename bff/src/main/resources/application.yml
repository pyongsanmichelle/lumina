spring:
  application:
    name: bff

  webflux:
    base-path: /bff
    forward-headers-strategy: framework

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: lumina-bff
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost:8082/realms/lumina/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/lumina/protocol/openid-connect/token}
            user-info-uri: ${KEYCLOAK_USER_INFO_URI:http://keycloak:8080/realms/lumina/protocol/openid-connect/userinfo}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/lumina/protocol/openid-connect/certs}

  reactive:
    session:
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: Lax

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# BFF独自のアプリケーション設定（環境変数から注入）
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  bff-origin: ${BFF_ORIGIN:http://localhost:8080}
  api-base-url: ${APP_API_BASE_URL:http://api:8081/api/v1}
  keycloak-logout-url: ${KEYCLOAK_LOGOUT_URL:http://localhost:8082/realms/lumina/protocol/openid-connect/logout}