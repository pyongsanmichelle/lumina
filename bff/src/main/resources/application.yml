spring:
  application:
    name: bff

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API（api/）のベースURL
# 環境変数 APP_API_BASE_URL で上書き可能（デフォルト: http://api:8081/api/v1）
app:
  api:
    base-url: ${APP_API_BASE_URL:http://api:8081/api/v1}