# ユーザーID関連
valid.user.idpSubject.required=IdPユーザーIDは必須です。
valid.user.idpSubject.size=IdPユーザーIDは{max}文字以内で入力してください。

# メールアドレス関連
valid.user.email.required=メールアドレスは必須です。
valid.user.email.format=メールアドレスの形式が不正です。
valid.user.email.size=メールアドレスは{max}文字以内で入力してください。

# ユーザー名関連
valid.user.name.required=ユーザー名は必須です。
valid.user.name.size=ユーザー名は{max}文字以内で入力してください。

# タイムゾーン関連
valid.user.timezone.required=タイムゾーンは必須です。
valid.user.timezone.size=タイムゾーンは{max}文字以内で入力してください。

# バージョン関連
valid.user.version.required=バージョンは必須です。

# 型変換エラー
valid.type.mismatch=数値を入力してください。

# ============================================
# エラーメッセージ (error)
# ============================================

# バリデーション全般
error.validation.failed=リクエストの検証に失敗しました。
error.malformed.request=リクエストの形式が不正です。

# リソース不在
error.resource.notfound=指定されたリソースが見つかりません。

# ユーザー関連
error.user.notfound=ユーザーが見つかりません。
error.user.duplicate={0}が既に登録されています。
error.user.status.disabled=無効化されているユーザーに対して、この操作を行うことはできません。

# 重複エラー
error.conflict=リソースが重複しています。

# 楽観ロック
error.optimistic.lock=対象のデータは他のユーザーによって既に更新されています。画面をリロードしてやり直してください。
error.optimistic.lock.conflict=楽観ロックの競合が発生しました。

# 業務ルール違反
error.business.rule.violation=業務ルールに違反しています。

# システムエラー
error.system=システムエラーが発生しました。管理者にお問い合わせください。

